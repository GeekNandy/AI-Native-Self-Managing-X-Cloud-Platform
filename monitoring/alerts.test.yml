rule_files:
  - /monitoring/alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="xcloud-workbench",instance="coordinator-1"}'
        values: '0+0x5'
      - series: 'platform_readiness_state{job="xcloud-workbench",instance="coordinator-1"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: XCloudCoordinatorTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: XCloudCoordinatorTargetDown
        exp_alerts:
          - exp_labels:
              job: xcloud-workbench
              instance: coordinator-1
              severity: page
            exp_annotations:
              summary: X Cloud coordinator scrape has failed
      - eval_time: 3m
        alertname: XCloudCoordinatorNotReady
        exp_alerts:
          - exp_labels:
              job: xcloud-workbench
              instance: coordinator-1
              severity: page
            exp_annotations:
              summary: X Cloud coordinator has reported not ready
  - interval: 1m
    input_series:
      - series: 'up{job="xcloud-workbench",instance="coordinator-1"}'
        values: '1+0x5'
      - series: 'platform_readiness_state{job="xcloud-workbench",instance="coordinator-1"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: XCloudCoordinatorTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: XCloudCoordinatorNotReady
        exp_alerts: []
