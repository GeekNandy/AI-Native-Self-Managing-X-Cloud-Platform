# Sample rules. Load only after a secured xcloud-workbench scrape job is configured.
groups:
  - name: xcloud-control-plane
    interval: 30s
    rules:
      - alert: XCloudCoordinatorTargetDown
        expr: up{job="xcloud-workbench"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: X Cloud coordinator scrape has failed

      - alert: XCloudCoordinatorNotReady
        expr: platform_readiness_state{job="xcloud-workbench"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: X Cloud coordinator has reported not ready

      - alert: XCloudRepeatedReadinessFailures
        expr: sum(increase(platform_readiness_checks_total{job="xcloud-workbench",result="not_ready"}[5m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: X Cloud readiness has failed repeatedly

      - alert: XCloudHighApi5xxRate
        expr: >-
          (
            sum(rate(http_server_requests_seconds_count{job="xcloud-workbench",outcome="SERVER_ERROR",uri!~"/actuator/.*|/readyz"}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{job="xcloud-workbench",uri!~"/actuator/.*|/readyz"}[5m])), 0.000001)
          ) > 0.05
          and
          sum(increase(http_server_requests_seconds_count{job="xcloud-workbench",uri!~"/actuator/.*|/readyz"}[5m])) > 20
        for: 10m
        labels:
          severity: page
        annotations:
          summary: X Cloud 5xx ratio exceeds 5 percent with meaningful traffic

      - alert: XCloudOperationsP95Slow
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="xcloud-workbench",uri="/api/operations"}[5m]))
          ) > 2
          and
          sum(increase(http_server_requests_seconds_count{job="xcloud-workbench",uri="/api/operations"}[5m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: X Cloud operations API p95 exceeds two seconds

      - alert: XCloudRepairBacklogStuck
        expr: platform_repair_queued{job="xcloud-workbench"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: X Cloud repair queue has not drained

      - alert: XCloudWorkerLost
        expr: sum(increase(platform_worker_jobs_total{job="xcloud-workbench",state="WORKER_LOST"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: X Cloud execution worker lost a job
