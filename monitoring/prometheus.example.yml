# Example only: do not put credentials in this file or commit real Prometheus config.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: xcloud-workbench
    scheme: https
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /etc/prometheus/secrets/xcloud_username
      password_file: /etc/prometheus/secrets/xcloud_password
    static_configs:
      - targets: ["x-cloud-workbench.onrender.com"]
