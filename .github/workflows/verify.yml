name: Verify workbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workbench_test
          POSTGRES_USER: workbench_test
          POSTGRES_PASSWORD: integration-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workbench_test -d workbench_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: docker pull eclipse-temurin:21-jdk
      - run: docker build -f sandbox/java21/Dockerfile -t xcloud-java21-runner:1 .
      - run: ./mvnw -B verify
        env:
          RUN_DOCKER_TESTS: true
          TEST_DATABASE_URL: postgres://workbench_test:integration-test-only@127.0.0.1:5432/workbench_test
      - run: python3 scripts/verify-restart.py
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python3 scripts/verify-container.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-evidence
          path: |
            target/docker-*-evidence.json
            target/surefire-reports/
            target/restart-evidence.json
            target/ui-accessibility.json
            target/hosted-container-evidence.json
            target/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
