spring.application.name=AI-Native Self-Managing Cloud Application Platform
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
platform.ai.provider=${PLATFORM_AI_PROVIDER:fixture}
platform.ai.model=${GEMINI_MODEL:}
platform.ai.api-key=${GEMINI_API_KEY:}

platform.data-dir=${PLATFORM_DATA_DIR:.workbench}
platform.runtime=${PLATFORM_RUNTIME:sandbox}
platform.auth.operator-token=${PLATFORM_OPERATOR_TOKEN:}
platform.auth.agent-token=${PLATFORM_AGENT_TOKEN:}

platform.nebius.model=${NEBIUS_MODEL:nvidia/Nemotron-3.5-Super-VL}
platform.nebius.api-key=${NEBIUS_API_KEY:}

platform.web.public-origin=${PUBLIC_ORIGIN:${RENDER_EXTERNAL_URL:}}
platform.web.username=${DEMO_USERNAME:}
platform.web.password=${DEMO_PASSWORD:}
platform.web.auth-required=${DEMO_AUTH_REQUIRED:false}

platform.web.ephemeral=${DEMO_EPHEMERAL:false}

platform.execution.mode=${PLATFORM_EXECUTION_MODE:local}
platform.worker.token=${PLATFORM_WORKER_TOKEN:}
platform.worker.oidc.audience=${WORKER_OIDC_AUDIENCE:}
platform.worker.oidc.repository-id=${WORKER_OIDC_REPOSITORY_ID:}
platform.worker.oidc.owner-id=${WORKER_OIDC_OWNER_ID:}
platform.worker.oidc.workflow=${WORKER_OIDC_WORKFLOW:}

platform.database-url=${DATABASE_URL:}

platform.github.token=${GITHUB_WORKBENCH_TOKEN:}

platform.github.publish-repository=${GITHUB_PUBLISH_REPOSITORY:}
platform.github.publish-branch=${GITHUB_PUBLISH_BRANCH:feature}

platform.capacity.repair-workers=${PLATFORM_REPAIR_WORKERS:2}
platform.capacity.repair-queue=${PLATFORM_REPAIR_QUEUE:16}
platform.capacity.remote-workers=${PLATFORM_REMOTE_WORKERS:4}
platform.capacity.remote-jobs=${PLATFORM_REMOTE_JOBS:16}
platform.capacity.job-history=${PLATFORM_JOB_HISTORY:200}
